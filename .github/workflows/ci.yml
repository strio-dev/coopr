name: CI

on:
  push:
    branches: [main]
    # Native globs select unprefixed version-shaped tags, not strict SemVer.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+\+*'
      # Reserve underscore for the registry's build-metadata encoding.
      - '!**_*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Generate check matrices
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      quality: ${{ steps.matrix.outputs.quality }}
      docs: ${{ steps.matrix.outputs.docs }}
      native: ${{ steps.matrix.outputs.native }}
      rootless: ${{ steps.matrix.outputs.rootless }}
      published: ${{ steps.release.outputs.published }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      image: ${{ steps.release.outputs.image }}
      image-tag: ${{ steps.release.outputs.image-tag }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - &nix-cache
        name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
      - id: matrix
        run: |
          matrices=$(nix eval --json --no-update-lock-file path:.#githubActions.matrices)
          for category in quality docs native rootless; do
            printf '%s=%s\n' "$category" "$(jq -c --arg category "$category" '.[$category]' <<< "$matrices")" >> "$GITHUB_OUTPUT"
          done
      - name: Read release metadata
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: release
        uses: &github-script actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('published', Boolean(release && !release.draft));
            core.setOutput('prerelease', tag.split('+', 1)[0].includes('-'));
            core.setOutput('image', `ghcr.io/${context.repo.owner}/${context.repo.repo}`.toLowerCase());
            core.setOutput('image-tag', tag.replaceAll('+', '_'));

  quality:
    name: Quality checks
    needs: matrix
    runs-on: ${{ fromJSON(needs.matrix.outputs.quality).include[0].os }}
    timeout-minutes: 45
    env:
      NIX_ATTRS: ${{ toJSON(fromJSON(needs.matrix.outputs.quality).include[0].attrs) }}
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - &check
        name: Run checks
        run: |
          mapfile -t attrs < <(jq -r '.[] | "path:.#" + .' <<< "$NIX_ATTRS")
          nix build --no-link --no-update-lock-file --print-build-logs "${attrs[@]}"

  documentation:
    name: Documentation checks
    needs: matrix
    runs-on: ${{ fromJSON(needs.matrix.outputs.docs).include[0].os }}
    timeout-minutes: 30
    env:
      NIX_ATTRS: ${{ toJSON(fromJSON(needs.matrix.outputs.docs).include[0].attrs) }}
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - *check
      - name: Locate documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: site
        run: |
          site=$(nix path-info --no-update-lock-file path:.#checks.x86_64-linux.docs)
          printf 'path=%s\n' "$site" >> "$GITHUB_OUTPUT"
      - name: Upload documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.path }}

  native-build:
    name: Native build checks
    if: github.event_name != 'push' || github.ref_type != 'tag'
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    env:
      NIX_ATTRS: ${{ toJSON(matrix.attrs) }}
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - *check

  rootless:
    name: Rootless
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.rootless) }}
    env:
      NIX_ATTRS: ${{ toJSON(matrix.attrs) }}
    steps:
      - *checkout
      - &release-version
        name: Set release version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: printf '%s\n' "$GITHUB_REF_NAME" > nix/release-version
      - *nix
      - *nix-cache
      - *check

  native:
    name: Native checks
    if: always() && (github.event_name != 'push' || github.ref_type != 'tag')
    needs: [matrix, native-build, rootless]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    env:
      NATIVE_RESULT: ${{ needs.native-build.result }}
      ROOTLESS_RESULT: ${{ needs.rootless.result }}
    steps:
      - name: Require all native and rootless checks
        run: |
          test "$NATIVE_RESULT" = success
          test "$ROOTLESS_RESULT" = success

  release-native:
    name: Native release checks
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [matrix, quality, documentation, rootless]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    env:
      NIX_ATTRS: ${{ toJSON(matrix.attrs) }}
      IMAGE: ${{ needs.matrix.outputs.image }}
      BUILD_TAG: build-${{ github.run_id }}
    steps:
      - *checkout
      - *release-version
      - *nix
      - *nix-cache
      - *check
      - name: Locate release archive
        if: needs.matrix.outputs.published != 'true'
        run: nix build --out-link result-release --no-update-lock-file path:.#release-binary
      - name: Upload release artifacts
        if: needs.matrix.outputs.published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.system }}
          path: result-release/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: Log in to GHCR
        if: needs.matrix.outputs.published != 'true'
        uses: &registry-login docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: &registry-credentials
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push native container
        if: needs.matrix.outputs.published != 'true'
        env:
          ARCH: ${{ matrix.system == 'x86_64-linux' && 'amd64' || 'arm64' }}
        run: nix run --no-update-lock-file path:.#container.copyTo -- "docker://$IMAGE:$BUILD_TAG-$ARCH"

  docs:
    name: docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, documentation, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: docs
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs
      cancel-in-progress: false
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Publish binaries and containers
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [matrix, quality, documentation, rootless, release-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.matrix.outputs.image }}
      IMAGE_TAG: ${{ needs.matrix.outputs.image-tag }}
      BUILD_TAG: build-${{ github.run_id }}
    steps:
      - *checkout
      - *release-version
      - *nix
      - *nix-cache
      - name: Read current release state
        id: state
        uses: *github-script
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const release = releases.find(item => item.tag_name === process.env.GITHUB_REF_NAME);
            core.setOutput('exists', Boolean(release));
            core.setOutput('published', Boolean(release && !release.draft));
      - name: Download release artifacts
        if: steps.state.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/
      - name: Collect source archive and checksums
        if: steps.state.outputs.published != 'true'
        run: |
          nix build --out-link result-sources --no-update-lock-file --print-build-logs path:.#release-source
          cp result-sources/*.tar.gz dist/
          (cd dist && nix develop --no-update-lock-file path:..#release --command sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Log in to GHCR
        uses: *registry-login
        with: *registry-credentials
      - name: Publish corresponding sources
        if: steps.state.outputs.published != 'true'
        run: nix run --no-update-lock-file path:.#container-source.copyTo -- --format oci "docker://$IMAGE:source-$IMAGE_TAG"
      - name: Publish multi-platform index
        if: steps.state.outputs.published != 'true'
        run: |
          nix develop --no-update-lock-file path:.#release --command regctl index create "$IMAGE:$IMAGE_TAG" \
            --ref "$IMAGE:$BUILD_TAG-amd64" --platform linux/amd64 \
            --ref "$IMAGE:$BUILD_TAG-arm64" --platform linux/arm64
      - name: Upload release assets
        if: steps.state.outputs.published != 'true'
        uses: &github-release softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ needs.matrix.outputs.prerelease }}
          make_latest: 'false'
          generate_release_notes: ${{ steps.state.outputs.exists != 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/coopr-linux-amd64.tar.gz
            dist/coopr-linux-arm64.tar.gz
            dist/coopr-sources.tar.gz
            dist/SHA256SUMS
      - name: Publish release
        if: steps.state.outputs.published != 'true'
        uses: *github-release
        with:
          draft: false
          prerelease: ${{ needs.matrix.outputs.prerelease }}
          make_latest: ${{ needs.matrix.outputs.prerelease != 'true' }}
      - name: Check latest release on rerun
        if: steps.state.outputs.published == 'true' && needs.matrix.outputs.prerelease != 'true'
        id: latest
        uses: *github-script
        with:
          retries: 3
          # Retry transient GitHub API failures.
          retry-exempt-status-codes: '400,401,403,422'
          script: |
            const { data: latest } = await github.rest.repos.getLatestRelease(context.repo);
            core.setOutput('current', latest.tag_name === process.env.GITHUB_REF_NAME);
      - name: Update latest container alias
        if: needs.matrix.outputs.prerelease != 'true' && (steps.state.outputs.published != 'true' || steps.latest.outputs.current == 'true')
        run: |
          digest=$(nix develop --no-update-lock-file path:.#release --command regctl image digest "$IMAGE:$IMAGE_TAG")
          nix develop --no-update-lock-file path:.#release --command regctl image copy "$IMAGE@$digest" "$IMAGE:latest"
